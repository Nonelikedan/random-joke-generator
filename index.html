<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Joke Generator</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="scene" aria-hidden="true">
      <div class="moon"></div>
      <div class="bat bat-one"></div>
      <div class="bat bat-two"></div>
      <div class="bat bat-three"></div>
      <div class="pumpkin pumpkin-left">
        <span class="stem"></span>
        <span class="eye left"></span>
        <span class="eye right"></span>
        <span class="smile"></span>
      </div>
      <div class="pumpkin pumpkin-right">
        <span class="stem"></span>
        <span class="eye left"></span>
        <span class="eye right"></span>
        <span class="smile"></span>
      </div>
    </div>

    <main class="container">
      <section class="joke-card">
        <p class="eyebrow">RANDOM JOKE GENERATOR</p>

        <h1>Need a laugh?</h1>

        <p class="description">
          Click the button and let the internet ruin your sense of humor.
        </p>

        <div class="joke-box">
          <p id="joke">Your joke will appear here...</p>
          <p id="punchline" class="punchline-text hidden"></p>
          <button id="revealBtn" class="hidden">Reveal Punchline</button>
        </div>

        <button id="jokeBtn">Tell me a joke</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
